name: "technical_qc"
description: "Technical comparability - each personal sample's read retention at every ampliseq step, against the panel"
keywords:
  - microbiome
  - quality control
  - read tracking
  - ampliseq
tools:
  - "pandas":
      description: "Powerful data structures for data analysis in Python"
      homepage: "https://pandas.pydata.org"
      documentation: "https://pandas.pydata.org/docs/"
      licence: ["BSD-3-Clause"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map with run information, e.g. `[ id:'native' ]`
    - overall_summary:
        type: file
        description: The read tracking table of the ampliseq run (overall_summary.tsv)
        pattern: "overall_summary.tsv"
    - collapse_stats:
        type: file
        description: Per-sample read totals and unassigned fractions from COLLAPSE_GENUS
        pattern: "*.collapse_stats.tsv"
  - samplesheet:
      type: file
      description: The validated pipeline samplesheet
      pattern: "*.csv"

output:
  metrics:
    - - meta:
          type: map
          description: Groovy Map with run information
      - "*.technical_metrics.tsv":
          type: file
          description: One row per sample with input reads, retention at each ampliseq step, analysed reads and unassigned fraction
          pattern: "*.technical_metrics.tsv"
  qc:
    - - meta:
          type: map
          description: Groovy Map with run information
      - "*.technical_qc.tsv":
          type: file
          description: Per personal sample and metric, the panel percentile, modified z-score and whether it is atypical, plus one overall row per sample
          pattern: "*.technical_qc.tsv"
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "pandas":
          type: string
          description: The name of the tool
      - 'python3 -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "numpy":
          type: string
          description: The name of the tool
      - 'python3 -c "import numpy; print(numpy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - process:
          type: string
          description: The process the versions were collected from
      - tool:
          type: string
          description: The tool name the version was collected for
      - version:
          type: string
          description: The version of the tool

authors:
  - "@Biocentric"
maintainers:
  - "@Biocentric"
