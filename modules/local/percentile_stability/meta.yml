name: "percentile_stability"
description: "Flag genus positions that change category between the uncorrected and the batch-corrected panel"
keywords:
  - microbiome
  - batch correction
  - sensitivity
  - percentile
tools:
  - "pandas":
      description: "Powerful data structures for data analysis in Python"
      homepage: "https://pandas.pydata.org"
      documentation: "https://pandas.pydata.org/docs/"
      licence: ["BSD-3-Clause"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map with run information, e.g. `[ id:'native' ]`
    - uncorrected:
        type: file
        description: Taxon percentiles against the uncorrected panel
        pattern: "*.taxon_percentiles.tsv"
    - corrected:
        type: file
        description: Taxon percentiles against the batch-corrected panel
        pattern: "*.corrected.taxon_percentiles.tsv"

output:
  stability:
    - - meta:
          type: map
          description: Groovy Map with run information
      - "*.percentile_stability.tsv":
          type: file
          description: Per genus and personal sample - percentile against the uncorrected and the corrected panel, the low / middle / high category of each, and whether they agree
          pattern: "*.percentile_stability.tsv"
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "pandas":
          type: string
          description: The name of the tool
      - 'python3 -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "numpy":
          type: string
          description: The name of the tool
      - 'python3 -c "import numpy; print(numpy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - process:
          type: string
          description: The process the versions were collected from
      - tool:
          type: string
          description: The tool name the version was collected for
      - version:
          type: string
          description: The version of the tool

authors:
  - "@Biocentric"
maintainers:
  - "@Biocentric"
