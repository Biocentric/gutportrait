name: "positive_control"
description: "Injected-signal positive control - stops the run if batch correction erases an effect planted on purpose"
keywords:
  - microbiome
  - positive control
  - batch correction
  - gate
tools:
  - "mmuphin":
      description: "Meta-analysis methods with uniform pipeline for heterogeneity in microbiome studies, including batch correction of microbial abundance data"
      homepage: "https://huttenhower.sph.harvard.edu/mmuphin"
      documentation: "https://bioconductor.org/packages/MMUPHin"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map with run information, e.g. `[ id:'native' ]`
    - genus_counts:
        type: file
        description: Genus-by-sample counts for all samples, from COLLAPSE_GENUS
        pattern: "*.genus_counts.tsv"
  - samplesheet:
      type: file
      description: The validated pipeline samplesheet
      pattern: "*.csv"

output:
  result:
    - - meta:
          type: map
          description: Groovy Map with run information
      - "*.positive_control.tsv":
          type: file
          description: Verdict (PASS, FAIL or NOT_APPLICABLE), the planted genus, fold, retained share of the planted CLR shift and the paired Wilcoxon p
          pattern: "*.positive_control.tsv"
  versions_r_base:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "r-base":
          type: string
          description: The name of the tool
      - 'Rscript -e "cat(paste(R.version[c(''major'', ''minor'')], collapse = ''.''))"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_mmuphin:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "mmuphin":
          type: string
          description: The name of the tool
      - 'Rscript -e "cat(as.character(packageVersion(''MMUPHin'')))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - process:
          type: string
          description: The process the versions were collected from
      - tool:
          type: string
          description: The tool name the version was collected for
      - version:
          type: string
          description: The version of the tool

authors:
  - "@Biocentric"
maintainers:
  - "@Biocentric"
